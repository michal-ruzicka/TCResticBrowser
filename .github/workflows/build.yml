name: Build

# Runs on every push (all branches) and on every pull request.
# Purpose: verify that both bitnesses compile cleanly and the tests pass.
# Releases are NOT published here — artifacts are signed locally and
# uploaded to GitHub Releases by hand (see CONTRIBUTING.md).
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why are you running this manually? Testing reproducibility (after Microsoft's build environment changes?) or something else?"
        required: false

# Restrict the GITHUB_TOKEN to the minimum required — read-only checkout.
# The workflow does not publish releases or open PRs, so no write access
# is needed.
permissions:
  contents: read

# Cancel any in-progress run for the same ref so a fast-follow push does
# not queue up behind a stale one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# restic used by the live end-to-end tests (tmp\restic.exe). Pinned by the
# SHA-256 of the release ZIP, taken from the release's SHA256SUMS after
# verifying its GPG signature (key CF8F18F2844575973F79D4E191A6868BD3F7A907,
# Alexander Neumann). Bump both together, in a commit of their own.
env:
  RESTIC_VERSION: 0.19.1
  RESTIC_ZIP_SHA256: da948ad707ed690426473aaba2046cd61f8f90f6f0e7dab6be0d5796531de67d
  # rclone for the live tests of an rclone: and an S3 repository (tmp\rclone.exe). Pinned
  # the same way: the SHA-256 of the release ZIP from the release's
  # SHA256SUMS, whose clearsigned GPG signature was verified (key
  # FBF737ECE9F8AB18604BD2AC93935E02FF3B54FA, Nick Craig-Wood, from
  # https://rclone.org/KEYS). Bump both together, in a commit of their own.
  # Not named RCLONE_*: rclone reads every RCLONE_<FLAG> variable as its
  # --<flag> option, and this environment reaches the rclone the tests start
  # (RCLONE_VERSION=1.75.1 made it fail as --version=1.75.1).
  PINNED_RCLONE_VERSION: 1.75.1
  PINNED_RCLONE_ZIP_SHA256: 200eb602c126d82aa38b51e0f6b9ae837473ff99b51278d3f6f837574c494d6e
  # Visual Studio Build Tools, pinned to one release so that CI builds with
  # the same toolset libraries and Windows SDK as a local build of that
  # version (build.cmd EXPECTED_VS). The fixed-version bootstrapper comes from
  # https://learn.microsoft.com/visualstudio/releases/2026/release-history;
  # its SHA-256 is part of the URL and checked again below. Bump the three
  # together with EXPECTED_VS, in a commit of their own.
  VS_BUILDTOOLS_VERSION: 18.11.1
  VS_BUILDTOOLS_URL: https://download.visualstudio.microsoft.com/download/pr/e07fb79d-d4ec-45bc-b19d-200bc819ee8d/3b21743cfbd0458e7f4dba87981fb8b99602a974c7439b857878cfa3e9fba5f2/vs_BuildTools.exe
  VS_BUILDTOOLS_SHA256: 3b21743cfbd0458e7f4dba87981fb8b99602a974c7439b857878cfa3e9fba5f2
  # build.cmd uses this installation even if the runner image has a newer
  # Visual Studio that vswhere would prefer.
  TCRB_VSINSTALL: C:\BuildTools

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Install Visual Studio 2026 Build Tools of the pinned release. The
      # .vsconfig includes the VC.CMake.Project component, so CMake (and
      # Ninja) ship with the Build Tools — build.cmd puts them on PATH via
      # VsDevCmd.bat. No separate CMake install is needed; relying on the
      # bundled CMake also keeps the local and CI toolchains identical for
      # reproducible builds.
      - name: Setup the build environment
        shell: pwsh
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'vs_BuildTools.exe'
          Invoke-WebRequest -Uri $env:VS_BUILDTOOLS_URL -OutFile $exe
          $actual = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLower()
          if ($actual -ne $env:VS_BUILDTOOLS_SHA256) { throw "vs_BuildTools.exe hash mismatch: $actual" }
          $version = (Get-Item $exe).VersionInfo.ProductVersion
          if ($version -ne $env:VS_BUILDTOOLS_VERSION) { throw "vs_BuildTools.exe installs $version, not $env:VS_BUILDTOOLS_VERSION" }
          $setup = Start-Process -FilePath $exe -Wait -PassThru -ArgumentList @(
            '--config', (Join-Path $PWD '.vsconfig'), '--installPath', $env:TCRB_VSINSTALL,
            '--quiet', '--wait', '--norestart', '--nocache')
          # 3010 means "reboot requested", which is still a successful install
          if ($setup.ExitCode -ne 0 -and $setup.ExitCode -ne 3010) { throw "vs_BuildTools.exe exited with $($setup.ExitCode)" }

      # Without tmp\restic.exe the live tests only report [SKIP]. The ZIP is
      # refused unless its hash matches the pin above.
      - name: Fetch restic for the live tests
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'restic.zip'
          $url = "https://github.com/restic/restic/releases/download/v$env:RESTIC_VERSION/restic_$($env:RESTIC_VERSION)_windows_amd64.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          $actual = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower()
          if ($actual -ne $env:RESTIC_ZIP_SHA256) { throw "restic ZIP hash mismatch: $actual" }
          $dir = Join-Path $env:RUNNER_TEMP 'restic'
          Expand-Archive -Path $zip -DestinationPath $dir
          New-Item -ItemType Directory -Force -Path tmp | Out-Null
          Copy-Item (Join-Path $dir "restic_$($env:RESTIC_VERSION)_windows_amd64.exe") tmp\restic.exe

      # Without tmp\rclone.exe the rclone: and S3 scenarios report [SKIP]. Pinned like
      # restic above.
      - name: Fetch rclone for the live tests
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'rclone.zip'
          $url = "https://github.com/rclone/rclone/releases/download/v$env:PINNED_RCLONE_VERSION/rclone-v$($env:PINNED_RCLONE_VERSION)-windows-amd64.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          $actual = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower()
          if ($actual -ne $env:PINNED_RCLONE_ZIP_SHA256) { throw "rclone ZIP hash mismatch: $actual" }
          $dir = Join-Path $env:RUNNER_TEMP 'rclone'
          Expand-Archive -Path $zip -DestinationPath $dir
          New-Item -ItemType Directory -Force -Path tmp | Out-Null
          Copy-Item (Join-Path $dir "rclone-v$($env:PINNED_RCLONE_VERSION)-windows-amd64\rclone.exe") tmp\rclone.exe

      # build.cmd locates Visual Studio Build Tools via vswhere, activates the
      # compiler environment for each target architecture via VsDevCmd.bat,
      # drives CMake (NMake Makefiles generator) for both x64 and x86, runs the
      # test programs for each bitness and packages the ZIP.
      - name: Build and test (x86 + x64)
        shell: cmd
        run: build.cmd

      # The fingerprints describe toolchain, libraries, options and hashes of
      # each bitness; compare them with a local build's when the ZIP hashes
      # differ (CONTRIBUTING.md, "When the hashes differ").
      - name: Upload build fingerprints
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TCResticBrowser-fingerprints
          path: build\fingerprint-*.txt
          if-no-files-found: warn
          retention-days: 90

      # Debug build with the CRT leak checker, MSVC /analyze, and the unit
      # tests under AddressSanitizer (x64).
      - name: Extra checks (Debug, /analyze, AddressSanitizer)
        shell: cmd
        run: build.cmd check

      # Make the distributable ZIP downloadable from the Actions run page.
      # It is not published as a GitHub Release — that step is done locally
      # after GPG-signing the artifact.
      - name: Upload distributable ZIP
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TCResticBrowser-dist
          path: dist\*.zip
          if-no-files-found: error
          retention-days: 90
