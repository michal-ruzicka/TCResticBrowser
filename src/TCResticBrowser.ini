; ==============================================================================
; Restic File System Plugin (WFX) for Total Commander - Configuration File
; ==============================================================================
;
; PLACEMENT:
;   The plugin uses the first of these files that exists (no merging):
;   1. %APPDATA%\GHISLER\TCResticBrowser.ini - per-user override
;   2. <plugin_dir>\TCResticBrowser.ini      - this sample, shipped with the plugin
;
;   To configure the plugin, copy this file to %APPDATA%\GHISLER\ and edit the
;   copy; a plugin upgrade replaces only the sample in the plugin folder.
;
; ENCODING:
;   Save this file as UTF-8 (the default of most editors), so repository
;   aliases and paths may contain any characters. A UTF-8 or UTF-16 byte-order
;   mark is honoured as well.
;
; SECURITY:
;   Do NOT store repository passwords in this file. The plugin prompts for the
;   repository password interactively via Total Commander's native password
;   dialog and keeps it encrypted in RAM only, for PasswordTimeoutSeconds
;   (30 minutes by default, see [Settings] below).
; ==============================================================================

[Settings]
; Path to the Restic CLI executable (restic.exe).
;
; When ResticPath is set, exactly that binary is used: a full path, a path
; relative to the plugin's folder, or a bare name looked up in the plugin's
; folder and then in the system PATH. If it does not exist, the plugin reports
; an error; it never falls back to another restic.exe.
;
; When ResticPath is omitted, empty or commented out:
;   1. <plugin_dir>\restic.exe (next to the plugin DLL)
;   2. restic.exe in the system PATH environment variable
;
; Examples:
;   ResticPath=restic.exe
;   ResticPath=tools\restic.exe
;   ResticPath=C:\Tools\restic\restic.exe
;   ResticPath=C:\Program Files\Restic\restic.exe
;
; Paths with spaces need no quotes: everything after "=" up to the end of the
; line is the value (surrounding spaces are trimmed). Quotes are optional and
; removed when they enclose the whole value. A backslash at the end of a value
; is kept as it is; it does not continue the line.
;
;ResticPath=C:\Program Files\Restic\restic.exe

; Name of the plugin's folder in Total Commander's Network Neighborhood.
; Default when omitted, empty or invalid: TCResticBrowser
;
; Total Commander asks for the name only while installing the plugin and then
; remembers it, so set RootName before installing (in the per-user file), or
; remove and add the plugin again after changing it. The name must be a valid
; folder name (none of \ / : * ? " < > |) that the Windows ANSI code page can
; represent; otherwise the default is used.
;
; Examples:
;   RootName=ResticBackups
;   RootName=Backups
;   RootName=restic
;
;RootName=ResticBackups

; How long the plugin remembers a repository password, in seconds, counted
; from when restic first accepted it. After that the password is wiped from
; memory and asked for again on the next access. 0 keeps passwords until
; Total Commander exits.
; Default when omitted or not a plain number: 1800 (30 minutes)
;
; Examples:
;   PasswordTimeoutSeconds=3600
;   PasswordTimeoutSeconds=600
;
; PasswordTimeoutResetOnUse=yes starts the interval again with every
; operation that uses the password, so it is kept while you work with the
; repository and wiped once you leave it alone; pairs well with a short
; timeout. Values: yes/no (also true/false, on/off, 1/0). Default: no
;
; Examples:
;   PasswordTimeoutResetOnUse=yes
;   PasswordTimeoutResetOnUse=true
;   PasswordTimeoutResetOnUse=1
;   PasswordTimeoutResetOnUse=no
;   PasswordTimeoutResetOnUse=false
;   PasswordTimeoutResetOnUse=0
;
;PasswordTimeoutSeconds=600
;PasswordTimeoutResetOnUse=yes

; How old the list of a repository's snapshots may get, in seconds, before
; the plugin reads it again. The folders above the snapshots (snapshots,
; hosts, tags, ids) are always shown at once from the list read before; when
; that list is older than this, restic reads a new one in the background,
; and the next listing (e.g. Ctrl+R a moment later) shows it. Only the very
; first visit, and a folder name the old list does not know, wait for restic.
; 0 re-reads the list on every visit (still in the background).
; Default when omitted or not a plain number: 60 (as restic mount does)
;
; Examples:
;   SnapshotListRefreshSeconds=60
;   SnapshotListRefreshSeconds=600
;   SnapshotListRefreshSeconds=0
;
;SnapshotListRefreshSeconds=600

; Show Total Commander's FTP connections toolbar for the plugin, with a log
; of what the plugin does and what takes time (passwords accepted, refused
; and forgotten, snapshot lists and folders read by restic, files copied,
; reading whole snapshots in the background with progress every few
; seconds) and a Disconnect button that forgets all remembered passwords and
; cached listings. The toolbar appears when a repository is first used. Only Disconnect
; closes it again - "Forget N Passwords" and a password timeout cannot - and
; Total Commander then switches the panel back to where it was before.
; Set it to "no" to keep the toolbar away.
; Values: yes/no (also true/false, on/off, 1/0). Default: yes
;
;ConnectionLog=no

; Field separator of snapshots.csv, the list of all snapshots (short ID,
; host, paths, time, tags, full ID) in every repository folder, for spreadsheets.
; Excel splits a CSV file it opens at the list separator of the Windows
; regional settings (often ";" in Europe, "," in the US), so that is the
; default; set another one if your spreadsheet expects it.
; Values: , ; | or tab. Default: the Windows list separator
;
;CsvSeparator=;

; How the snapshot folders under snapshots, hosts\<host> and tags\<tag> are
; named: the time the snapshot was taken, written by this format. It plays
; the role of "restic mount --time-template", with simpler placeholders.
; Default when omitted: YYYY-MM-DD_hh-mm-ss (the colon-free template restic
; itself suggests, "2006-01-02_15-04-05"), e.g. 2026-10-18_09-30-00
;
; Placeholders (case-sensitive; every one is replaced by digits, zero-padded):
;   YYYY  year, 4 digits                     2026
;   YY    year without the century           26
;   MM    month, 01-12                       10
;   DD    day of the month, 01-31            18
;   hh    hour, 00-23                        09
;   mm    minute, 00-59                      30
;   ss    second, 00-59                      00
;   zzzz  time zone offset, sign and hhmm    +0200, -0500, +0000 (UTC)
; Every other character is copied as it is, so mind that MM is the month
; and mm the minute. The time is the snapshot's own clock time, in the time
; zone of the computer that made it (as restic shows it), not converted to
; yours; add zzzz when your backups come from several time zones.
;
; The format must contain at least one placeholder, at most 64 bytes, and
; none of the characters Windows forbids in file names (\ / : * ? " < > |),
; nor end with a dot or a space. An unusable format is ignored (the default
; is used, and the diagnostic log says so).
;
; Snapshots whose names come out the same - two in the same second, or two
; in the same day with YYYY-MM-DD - are told apart as restic mount does: the
; older one keeps the name, the next ones get -1, -2, ... appended.
;
; Examples (for a snapshot taken on 18 October 2026 at 09:30:00 in Prague):
;   SnapshotTimeFormat=YYYY-MM-DD_hh-mm-ss      2026-10-18_09-30-00 (default)
;   SnapshotTimeFormat=YYYY-MM-DD hh.mm.ss      2026-10-18 09.30.00
;   SnapshotTimeFormat=YYYY-MM-DDThh.mm.sszzzz  2026-10-18T09.30.00+0200
;   SnapshotTimeFormat=YYYYMMDD-hhmmss          20261018-093000
;   SnapshotTimeFormat=DD.MM.YYYY hh-mm         18.10.2026 09-30
;   SnapshotTimeFormat=YYYY-MM-DD               2026-10-18 (several a day: -1, -2...)
;
;SnapshotTimeFormat=YYYY-MM-DDThh.mm.ss

; Memory for complete snapshot listings, in MiB. When you enter a snapshot,
; the plugin reads the list of all its files and folders in the background
; (one "restic ls" for the whole snapshot); from then on every folder of that
; snapshot opens at once, without running restic. Until the list is complete,
; each folder is listed on its own as before. The lists of the least recently
; used snapshots are dropped when the memory is needed for another one, and
; all of them when the repository's password is forgotten. A snapshot needs
; roughly 100 bytes per file, so 512 MiB holds about five million files.
; 0 turns this off. Default when omitted or not a plain number: 512
; In 32-bit Total Commander at most 512 is used: its whole address space is
; 2 GiB.
;
; Examples:
;   SnapshotCacheMB=512
;   SnapshotCacheMB=1024
;   SnapshotCacheMB=0
;
;SnapshotCacheMB=4096

[Logging]
; Diagnostic logging is OFF by default so a log does not silently grow on disk.
; To turn it on, set LogPath to a writable file; environment variables such as
; %APPDATA%, %LOCALAPPDATA% or %TEMP% are expanded, and missing folders are
; created. The path must be absolute. The change takes effect with the next
; plugin operation, no restart needed. Leave the value empty (or comment the
; line out) to turn logging off again, and delete the file when done.
;
; The log records every restic command line, its exit code, duration and error
; output, password prompts (only the number of characters entered and whether
; the entry starts or ends with whitespace or contains invisible characters,
; never the password) and the configuration in use (credentials in repository
; URLs are masked). Lines are appended as UTF-8; the file is not rotated.
;
; Examples:
;   LogPath=%TEMP%\TCResticBrowser.log
;   LogPath=%LOCALAPPDATA%\TCResticBrowser\TCResticBrowser.log
;   LogPath=C:\Logs\TCResticBrowser.log
;
;LogPath=%APPDATA%\GHISLER\TCResticBrowser.log

[Repositories]
; Define one repository per line using the format:
;   <Alias>=<Repository Path or URL>
;
; Each <Alias> appears as a top-level folder under the plugin's folder
; ("\\\TCResticBrowser\" by default, see RootName) in Total Commander's
; Network Neighborhood. Spaces in aliases are allowed as well as in repository
; paths. Trailing backslashes in repository paths are optional.
;
; --- Local & Network Share (SMB/UNC) Repositories ---
; LocalBackup=D:\Backups\restic_repo
; Local Time Machine=C:\Users\me\AppData\Local\Time Machine.restic-repo\
; NasBackup=\\NAS\Backups\workstation_repo
;
; --- Restic REST Server ---
; RestServer=rest:http://192.168.1.50:8000/my_repo
; RestServerTLS=rest:https://backup.example.com:8000/my_repo
;
; --- SFTP (uses your system SSH agent / ~/.ssh/config) ---
; RemoteSftp=sftp:user@backup.example.com:/srv/restic/repo
;
; --- Amazon S3 / S3-Compatible (MinIO, Wasabi, Backblaze B2 S3, Cloudflare R2) ---
; Note: AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY (or backend-specific credentials)
;       are inherited from Total Commander's process environment.
; CloudS3=s3:s3.amazonaws.com/my-backup-bucket/restic
; MinioLocal=s3:http://192.168.1.60:9000/restic-bucket
;
; --- Rclone Backend ---
; CloudDrive=rclone:gdrive:Backups/restic_repo
